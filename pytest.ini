[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers
markers =
    smoke: main happy path of each endpoint
    negative: invalid input, auth or resource
    boundary: limits of a field or of pagination
    e2e: chained flow of several requests
    no_token: does not need GITHUB_TOKEN
    happy_path: expected behaviour with valid input (added automatically)
    p1: high priority, run on every change (added automatically, see docs/test-organization.md)
    p2: medium priority
    p3: low priority
    regression: every classified test, run before a release (added automatically)
    gists: area, tests of the Gists endpoints (added automatically)
    issues: area, tests of the Issues endpoints (added automatically)
    labels: area, tests of the Labels endpoints (added automatically)
    milestones: area, tests of the Milestones endpoints (added automatically)
    repositories: area, tests of the Repositories endpoints (added automatically)
    search: area, tests of the Search endpoints (added automatically)